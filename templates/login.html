{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-[70vh]">
    <div class="bg-white shadow-md rounded-2xl p-8 w-full max-w-sm border border-slate-100">
        <h1 class="text-xl font-semibold text-slate-800 mb-6 text-center">Acessar sistema</h1>

        <form method="POST" class="space-y-4">
            <div>
                <label class="text-sm text-slate-600">E-mail</label>
                <input type="email" name="email" required
                       class="w-full mt-1 px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-400 outline-none">
            </div>
            <div>
                <label class="text-sm text-slate-600">Senha</label>
                <input type="password" name="senha" required
                       class="w-full mt-1 px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-400 outline-none">
            </div>
            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">
                Entrar
            </button>
        </form>
    </div>
</div>
{% endblock %}
