{% extends "base.html" %}

{% block title %}Bloquear Sala{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="{{ url_for('recepcionista.painel') }}"
           class="text-sm text-indigo-600 hover:text-indigo-800">
            ← Voltar para o painel
        </a>

        <h1 class="text-2xl font-semibold text-slate-800 mt-3">
            Bloquear sala
        </h1>

        <p class="text-sm text-slate-500 mt-1">
            Impede novas reservas durante o período informado.
        </p>
    </div>

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
        <form method="POST" class="space-y-5">

            <div>
                <label for="sala_id" class="block text-sm font-medium text-slate-700">
                    Sala
                </label>

                <select
                    id="sala_id"
                    name="sala_id"
                    required
                    class="w-full mt-1 px-4 py-2.5 rounded-lg border border-slate-200
                           focus:outline-none focus:ring-2 focus:ring-indigo-400">

                    <option value="">Selecione uma sala</option>

                    {% for sala in salas %}
                        <option value="{{ sala.id }}">
                            {{ sala.nome }} — {{ sala.capacidade }} lugares
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="inicio" class="block text-sm font-medium text-slate-700">
                        Início do bloqueio
                    </label>

                    <input
                        type="datetime-local"
                        id="inicio"
                        name="inicio"
                        required
                        class="w-full mt-1 px-4 py-2.5 rounded-lg border border-slate-200
                               focus:outline-none focus:ring-2 focus:ring-indigo-400">
                </div>

                <div>
                    <label for="fim" class="block text-sm font-medium text-slate-700">
                        Fim do bloqueio
                    </label>

                    <input
                        type="datetime-local"
                        id="fim"
                        name="fim"
                        required
                        class="w-full mt-1 px-4 py-2.5 rounded-lg border border-slate-200
                               focus:outline-none focus:ring-2 focus:ring-indigo-400">
                </div>
            </div>

            <div>
                <label for="motivo" class="block text-sm font-medium text-slate-700">
                    Motivo do bloqueio
                </label>

                <textarea
                    id="motivo"
                    name="motivo"
                    rows="4"
                    placeholder="Ex.: Manutenção, limpeza, evento interno..."
                    class="w-full mt-1 px-4 py-2.5 rounded-lg border border-slate-200
                           focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
            </div>

            <div id="mensagem-horario"
                 class="hidden rounded-lg px-4 py-3 text-sm">
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <a href="{{ url_for('recepcionista.painel') }}"
                   class="px-5 py-2.5 rounded-lg bg-slate-100 hover:bg-slate-200
                          text-slate-700 text-sm transition">
                    Cancelar
                </a>

                <button
                    type="submit"
                    class="px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700
                           text-white text-sm font-medium transition">
                    Confirmar bloqueio
                </button>
            </div>
        </form>
    </div>
</div>

<script>
const inicio = document.getElementById("inicio");
const fim = document.getElementById("fim");
const mensagem = document.getElementById("mensagem-horario");

function validarHorario() {
    if (!inicio.value || !fim.value) {
        mensagem.classList.add("hidden");
        return true;
    }

    const dataInicio = new Date(inicio.value);
    const dataFim = new Date(fim.value);

    mensagem.classList.remove("hidden");

    if (dataFim <= dataInicio) {
        mensagem.textContent = "O horário final deve ser posterior ao horário inicial.";
        mensagem.className =
            "rounded-lg px-4 py-3 text-sm bg-red-50 text-red-700 border border-red-200";
        return false;
    }

    mensagem.textContent = "Período de bloqueio válido.";
    mensagem.className =
        "rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-700 border border-emerald-200";

    return true;
}

inicio.addEventListener("change", validarHorario);
fim.addEventListener("change", validarHorario);

document.querySelector("form").addEventListener("submit", function(event) {
    if (!validarHorario()) {
        event.preventDefault();
    }
});
</script>
{% endblock %}
