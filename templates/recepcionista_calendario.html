{% extends "base.html" %}
{% block title %}Calendário{% endblock %}

{% block content %}

{% if request.path != url_for('inicio') %}
        <button onclick="window.history.back()"
                class="mb-4 inline-flex items-center gap-2 text-sm text-slate-600
                       hover:text-slate-900 bg-white hover:bg-slate-100
                       border border-slate-200 px-4 py-2 rounded-lg transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Voltar
        </button>
        {% endif %}

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
    <div id="calendario"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const el = document.getElementById('calendario');
    const calendar = new FullCalendar.Calendar(el, {
        initialView: 'timeGridWeek',
        locale: 'pt-br',
        height: 700,
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: '/colaborador/api/eventos-calendario'
    });
    calendar.render();
});
</script>
{% endblock %}
